<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Racing</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; text-align: center; margin: 0; padding: 20px; }
        canvas { border: 4px solid #f00; background: #222; }
        .btn { padding: 15px 30px; font-size: 20px; background: #0f0; border: none; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>
    <h1 style="color:#f00">🏎️ RACING</h1>
    <canvas id="c" width="600" height="400"></canvas>
    <br>
    <button class="btn" onclick="start()">▶ BOSHLASH</button>
    <div style="margin:15px">
        <span style="color:#0ff">P1: W,A,S,D</span>
        <span style="color:#f90">P2: ↑,←,→,↓</span>
    </div>

    <script>
        var c = document.getElementById('c');
        var x = c.getContext('2d');
        var w = 600, h = 400;
        
        var p1 = {x:200,y:350,a:0,s:0,c:'#0ff'};
        var p2 = {x:400,y:350,a:0,s:0,c:'#f90'};
        var run = 0;
        var g = {};
        var k = {};
        
        document.onkeydown = function(e){ g[e.key]=1; };
        document.onkeyup = function(e){ g[e.key]=0; };
        
        function start(){
            p1.x=200; p1.y=350; p1.a=0; p1.s=0;
            p2.x=400; p2.y=350; p2.a=0; p2.s=0;
            run = 1;
            loop();
        }
        
        function loop(){
            if(!run) return;
            
            x.fillStyle = '#222';
            x.fillRect(0,0,w,h);
            
            // Track
            x.strokeStyle = '#444';
            x.lineWidth = 100;
            x.beginPath();
            x.ellipse(300,200,250,150,0,0,Math.PI*2);
            x.stroke();
            
            // P1
            x.save();
            x.translate(p1.x,p1.y);
            x.rotate(p1.a);
            x.fillStyle = p1.c;
            x.fillRect(-15,-8,30,16);
            x.restore();
            
            // P2
            x.save();
            x.translate(p2.x,p2.y);
            x.rotate(p2.a);
            x.fillStyle = p2.c;
            x.fillRect(-15,-8,30,16);
            x.restore();
            
            // P1 control
            if(g.w||g.W){ p1.s += 0.2; if(p1.s>6)p1.s=6; }
            else { p1.s *= 0.98; }
            if(g.s||g.S){ p1.s -= 0.2; }
            if(g.a||g.A && Math.abs(p1.s)>0.5){ p1.a -= 0.06 * (p1.s>0?1:-1); }
            if(g.d||g.D && Math.abs(p1.s)>0.5){ p1.a += 0.06 * (p1.s>0?1:-1); }
            p1.x += Math.cos(p1.a)*p1.s;
            p1.y += Math.sin(p1.a)*p1.s;
            
            // P2 control
            if(g.ArrowUp){ p2.s += 0.2; if(p2.s>6)p2.s=6; }
            else { p2.s *= 0.98; }
            if(g.ArrowDown){ p2.s -= 0.2; }
            if(g.ArrowLeft && Math.abs(p2.s)>0.5){ p2.a -= 0.06 * (p2.s>0?1:-1); }
            if(g.ArrowRight && Math.abs(p2.s)>0.5){ p2.a += 0.06 * (p2.s>0?1:-1); }
            p2.x += Math.cos(p2.a)*p2.s;
            p2.y += Math.sin(p2.a)*p2.s;
            
            requestAnimationFrame(loop);
        }
        
        loop();
    </script>
</body>
</html>
