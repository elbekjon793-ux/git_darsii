<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong 2</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #0f0; margin: 10px; }
        #cvs { border: 3px solid #f06; display: block; }
        .menu {
            position: absolute;
            background: rgba(0,0,0,0.9);
            width: 500px; height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .green { background: #0f0; color: #111; }
        .blue { background: #06f; color: white; }
        .yellow { background: #ff0; color: #111; }
        .red { background: #f06; color: white; }
        .key { background: #f06; padding: 5px 10px; border-radius: 5px; }
        .info { margin: 10px; font-size: 14px; color: #888; }
        .modeBtn { padding: 12px 30px; font-size: 18px; }
        @media (max-width: 520px) { 
            .menu { width: 90vw; } 
        }
    </style>
</head>
<body>
    <h1>🏓 PONG</h1>
    <div style="position:relative">
        <canvas id="cvs" width="500" height="300"></canvas>
        
        <div id="menu" class="menu">
            <h2 style="color:#0f0">PONG</h2>
            <p style="color:#888">Rejimni tanlang</p>
            <button class="btn green modeBtn" onclick="start(2)">👥 2 KISHI</button>
            <button class="btn yellow modeBtn" onclick="startAI()">🤖 vs KOMPYUTER</button>
        </div>
        
        <div id="pause" class="menu" style="display:none">
            <h2 style="color:#ff0">⏸️ PAUSE</h2>
            <button class="btn yellow" onclick="res()">DAVOM</button>
            <button class="btn red" onclick="quit()">CHIQISH</button>
        </div>
        
        <div id="goal" class="menu" style="display:none">
            <h2 id="goalTxt" style="color:#ff0;font-size:30px">GOAL!</h2>
            <p id="goalTmr" style="color:#f06;font-size:24px">3</p>
        </div>
    </div>
    
    <div class="info">
        <span style="color:#0f0">Siz:</span> <span class="key">W</span><span class="key">S</span>
        &nbsp;&nbsp;
        <span style="color:#f06" id="p2label">2-o'yinchi:</span> <span class="key">↑</span><span class="key">↓</span>
    </div>
    
    <div style="display:flex;gap:20px;margin:10px;display:none" id="mob">
        <div>
            <div style="color:#0f0">Siz</div>
            <button class="btn green" style="padding:10px 20px" ontouchstart="k1=1" ontouchend="k1=0">▲</button>
            <button class="btn green" style="padding:10px 20px" ontouchstart="k2=1" ontouchend="k2=0">▼</button>
        </div>
        <div id="mobP2" style="display:none">
            <div style="color:#f06">2</div>
            <button class="btn red" style="padding:10px 20px" ontouchstart="k3=1" ontouchend="k3=0">▲</button>
            <button class="btn red" style="padding:10px 20px" ontouchstart="k4=1" ontouchend="k4=0">▼</button>
        </div>
    </div>
    
    <script>
        var cvs = document.getElementById('cvs');
        var ctx = cvs.getContext('2d');
        var w = cvs.width, h = cvs.height;
        var mode = 2; // 1=1 kishi, 2=2 kishi, 3=vs AI
        
        if(window.innerWidth < 520) {
            cvs.width = window.innerWidth - 20;
            cvs.height = cvs.width * 0.6;
            w = cvs.width; h = cvs.height;
        }
        
        var pw = 12, ph = 70, ps = 7, pg = 10, br = 8;
        var p1y = h/2-ph/2, p2y = h/2-ph/2;
        var bx = w/2, by = h/2, bxv = 4, byv = 3;
        var sc1 = 0, sc2 = 0, run = false;
        var pwrs = [], lpw = Date.now();
        var frz = 0, p1fr = false, p2fr = false, sup = 0;
        var splitBalls = [];
        var goalState = false, goalEnd = 0;
        
        var k = {};
        var k1=0,k2=0,k3=0,k4=0;
        
        document.onkeydown = function(e){ k[e.key]=1; if(e.key==='Escape'&&run&&!goalState) pau(); };
        document.onkeyup = function(e){ k[e.key]=0; };
        
        function start(m){
            mode = m;
            document.getElementById('p2label').innerText = mode===2 ? '2-o\'yinchi:' : 'Kompyuter:';
            startGame();
        }
        
        function startAI(){
            start(3);
        }
        
        function startGame(){
            sc1=sc2=0; p1y=p2y=h/2-ph/2; pwrs=[]; splitBalls=[];
            p1fr=p2fr=false; frz=sup=0;
            run = true; goalState = false;
            hideAll();
            // Mobile tugmalar
            if(window.innerWidth < 520){
                document.getElementById('mob').style.display = 'flex';
                document.getElementById('mobP2').style.display = mode>=2 ? 'flex' : 'none';
            }
            loop();
        }
        
        function res(){
            run = true; goalState = false;
            hideAll();
            loop();
        }
        
        function pau(){
            if(goalState) return;
            run = false;
            document.getElementById('pause').style.display = 'flex';
        }
        
        function quit(){
            run = false; goalState = false;
            hideAll();
            document.getElementById('menu').style.display = 'flex';
        }
        
        function hideAll(){
            document.getElementById('menu').style.display = 'none';
            document.getElementById('pause').style.display = 'none';
            document.getElementById('goal').style.display = 'none';
        }
        
        function rst(){
            bx=w/2; by=h/2; bxv=4*(Math.random()>0.5?1:-1); byv=3*(Math.random()*2-1);
            splitBalls = [];
        }
        
        function spw(){
            var t = [['❄️','F','#0ff'],['⚡','S','#ff0'],['🐢','L','#0f0'],['🟣','B','#f0f']];
            var tt = t[Math.floor(Math.random()*4)];
            pwrs.push({x:pg+pw+30+Math.random()*(w-pg*2-pw-60), y:30+Math.random()*(h-60), ic:tt[0], tp:tt[1], col:tt[2], r:15});
        }
        
        function apw(tp,pl){
            if(tp==='F'){ if(pl==1) p1fr=true; else p2fr=true; frz=4000; }
            else if(tp==='S'){ sup=6000; }
            else if(tp==='L'){ var ox=bxv, oy=byv; bxv*=0.4; byv*=0.4; setTimeout(function(){bxv=ox;byv=oy;},4000); }
            else if(tp==='B'){ splitBalls.push({x:bx, y:by, vx:bxv*0.8, vy:byv, t:5000}); }
        }
        
        function showGoal(scorer){
            goalState = true;
            goalEnd = Date.now() + 3000;
            document.getElementById('goal').style.display = 'flex';
            if(scorer === 1){
                document.getElementById('goalTxt').innerText = '⚽ GOAL!';
                document.getElementById('goalTxt').style.color = '#0f0';
            } else {
                document.getElementById('goalTxt').innerText = '⚽ GOAL!';
                document.getElementById('goalTxt').style.color = '#f06';
            }
        }
        
        function loop(){
            ctx.fillStyle = '#222';
            ctx.fillRect(0,0,w,h);
            
            ctx.setLineDash([10,15]);
            ctx.strokeStyle = '#f06';
            ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
            
            ctx.fillStyle = p1fr?'#088':'#0f0';
            ctx.fillRect(pg,p1y,pw,ph);
            
            ctx.fillStyle = p2fr?'#808':'#f06';
            ctx.fillRect(w-pg-pw,p2y,pw,ph);
            
            pwrs.forEach(function(p){
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.fill();
                ctx.font='18px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(p.ic,p.x,p.y);
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.strokeStyle=p.col; ctx.lineWidth=2; ctx.stroke();
            });
            
            splitBalls.forEach(function(s,i){
                ctx.beginPath(); ctx.arc(s.x,s.y,br,0,Math.PI*2);
                ctx.fillStyle='#f0f'; ctx.fill();
                s.x += s.vx; s.y += s.vy;
                if(s.y-br<0 || s.y+br>h) s.vy = -s.vy;
                if(s.x-br<pg+pw && s.x-br>pg && s.y>p1y && s.y<p1y+ph){ s.vx=Math.abs(s.vx); s.vy=(s.y-(p1y+ph/2))*0.15; }
                if(s.x+br>w-pg-pw && s.x+br<w-pg && s.y>p2y && s.y<p2y+ph){ s.vx=-Math.abs(s.vx); s.vy=(s.y-(p2y+ph/2))*0.15; }
                s.t -= 16;
                if(s.t<=0) splitBalls.splice(i,1);
            });
            
            ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2);
            ctx.fillStyle = sup>0?'#ff0':'#fff'; ctx.fill();
            if(sup>0){
                ctx.beginPath(); ctx.arc(bx,by,br+4,0,Math.PI*2);
                ctx.strokeStyle='#ff0'; ctx.lineWidth=2; ctx.stroke();
            }
            
            if(!run) return;
            
            if(goalState){
                var left = Math.ceil((goalEnd - Date.now()) / 1000);
                if(left < 0) left = 0;
                document.getElementById('goalTmr').innerText = left;
                if(left === 0){ goalState = false; hideAll(); } 
                else { requestAnimationFrame(loop); return; }
            }
            
            if(frz>0){ frz-=16; if(frz<=0) p1fr=p2fr=false; }
            if(sup>0){ sup-=16; }
            if(Date.now()-lpw>7000){ spw(); lpw=Date.now(); }
            
            if(!p1fr){
                if(k.w||k1) p1y-=ps;
                if(k.s||k2) p1y+=ps;
            }
            
            // VS AI rejimida P2 - kompyuter
            if(mode === 3 && !p2fr){
                // AI: to'pni kuzatadi
                var targetY = by - ph/2;
                if(p2y < targetY - 20) p2y += 5;
                else if(p2y > targetY + 20) p2y -= 5;
            }else if(mode === 2 && !p2fr){
                // 2 kishi rejimi
                if(k.ArrowUp||k3) p2y-=ps;
                if(k.ArrowDown||k4) p2y+=ps;
            }
            
            p1y = Math.max(0, Math.min(h-ph,p1y));
            p2y = Math.max(0, Math.min(h-ph,p2y));
            
            var sm = sup>0?1.8:1;
            bx+=bxv*sm; by+=byv*sm;
            
            if(by-br<0||by+br>h) byv=-byv;
            
            if(bx-br<pg+pw && bx-br>pg && by>p1y && by<p1y+ph){ bxv=Math.abs(bxv); byv=(by-(p1y+ph/2))*0.15; }
            if(bx+br>w-pg-pw && bx+br<w-pg && by>p2y && by<p2y+ph){ bxv=-Math.abs(bxv); byv=(by-(p2y+ph/2))*0.15; }
            
            for(var i=pwrs.length-1;i>=0;i--){
                var p=pwrs[i], d=Math.sqrt((bx-p.x)**2+(by-p.y)**2);
                if(d<br+p.r){ apw(p.tp,bx<w/2?1:2); pwrs.splice(i,1); }
            }
            
            if(bx<0){ sc2++; showGoal(2); rst(); }
            if(bx>w){ sc1++; showGoal(1); rst(); }
            
            ctx.font = '30px Arial';
            ctx.fillStyle = '#0f0';
            ctx.fillText(sc1, w/2 - 30, 40);
            ctx.fillStyle = '#f06';
            ctx.fillText(sc2, w/2 + 30, 40);
            
            requestAnimationFrame(loop);
        }
        
        cvs.onclick = function(){ if(run&&!goalState) pau(); };
        loop();
    </script>
</body>
</html>
