<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Clone</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <b>Boshqarish:</b><br>
        WASD - harakat<br>
        Space - sakrash<br>
        Chap tugma - blok qo'yish<br>
        O'ng tugma - blok o'chirish<br>
        1-5 - rang tanlash
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    
    <script>
        // O'yin o'zgaruvchilari
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        // Blokka o'xshashlar
        const voxels = [];
        let selectedColor = 0xFF8000;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        const colors = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0x00FFFF];
        
        init();
        animate();
        
        function init() {
            // Sahna
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 750);
            
            // Kamera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2;
            
            // Yoritgichlar
            const light = new THREE.HemisphereLight(0xFFFFFF, 0x777777);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);
            
            const directionalLight = new THREE.DirectionalLight(0xFFFFFF);
            directionalLight.position.set(50, 200, 100);
            scene.add(directionalLight);
            
            // Render
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Boshqarish
            controls = new THREE.PointerLockControls(camera, document.body);
            
            document.addEventListener('click', function() {
                controls.lock();
            });
            
            // Klavishalar
            const onKeyDown = function(event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': 
                        if (canJump) {
                            velocity.y += 20;
                            canJump = false;
                        }
                        break;
                    case 'Digit1': selectedColor = colors[0]; break;
                    case 'Digit2': selectedColor = colors[1]; break;
                    case 'Digit3': selectedColor = colors[2]; break;
                    case 'Digit4': selectedColor = colors[3]; break;
                    case 'Digit5': selectedColor = colors[4]; break;
                }
            };
            
            const onKeyUp = function(event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };
            
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            // Sichqoncha tugmalari
            document.addEventListener('mousedown', function(event) {
                if (!controls.isLocked) return;
                
                mouse.x = 0;
                mouse.y = 0;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(voxels, false);
                
                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    
                    if (event.button === 0) {
                        // Yangi blok qo'yish
                        const voxel = new THREE.Mesh(
                            new THREE.BoxGeometry(1, 1, 1),
                            new THREE.MeshLambertMaterial({ color: selectedColor })
                        );
                        
                        voxel.position.copy(intersect.point).add(intersect.face.normal);
                        voxel.position.divideScalar(1).floor().multiplyScalar(1).addScalar(0.5);
                        
                        scene.add(voxel);
                        voxels.push(voxel);
                    }
                    
                    if (event.button === 2) {
                        // Blokni o'chirish
                        if (intersect.object !== ground) {
                            scene.remove(intersect.object);
                            voxels.splice(voxels.indexOf(intersect.object), 1);
                        }
                    }
                }
            });
            
            // Yer
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            groundGeometry.rotateX(-Math.PI / 2);
            
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            scene.add(ground);
            voxels.push(ground);
            
            // Dastlabki bloklar
            for (let x = -5; x < 5; x++) {
                for (let z = -5; z < 5; z++) {
                    const cube = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1, 1),
                        new THREE.MeshLambertMaterial({ color: 0x8B4513 })
                    );
                    cube.position.set(x, 0, z);
                    scene.add(cube);
                    voxels.push(cube);
                }
            }
            
            // O'lcham o'zgarishi
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            
            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 5.0 * delta;
                
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();
                
                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                velocity.y -= 9.8 * 5.0 * delta;
                camera.position.y += velocity.y * delta;
                
                if (camera.position.y < 1.5) {
                    velocity.y = 0;
                    camera.position.y = 1.5;
                    canJump = true;
                }
            }
            
            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
