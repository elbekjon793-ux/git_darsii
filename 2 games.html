<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Block Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Press Start 2P', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Minecraft-style title */
        h1 {
            color: #fff;
            text-shadow: 4px 4px #000;
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 2px;
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 15px;
        }

        .player-score {
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 20px;
            border: 4px solid;
        }

        .player1-score {
            background-color: #5c1816;
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .player2-score {
            background-color: #18325c;
            border-color: #3498db;
            color: #3498db;
        }

        /* Game Area */
        #game-container {
            position: relative;
            border: 8px solid #5c5c5c;
            box-shadow: 0 0 30px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #4a2c0f 60%, #4a2c0f 100%);
            display: block;
        }

        /* Ground texture effect via CSS */
        #game-container::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -8px;
            right: -8px;
            height: 20px;
            background: repeating-linear-gradient(
                90deg,
                #3d2310,
                #3d2310 20px,
                #2d1810 20px,
                #2d1810 40px
            );
            border: 4px solid #2a1a0a;
        }

        /* Winner display */
        #winner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 50px;
            font-size: 24px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        #restart-btn {
            display: none;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 16px;
            font-family: inherit;
            background-color: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #restart-btn:hover {
            background-color: #27ae60;
        }

        /* Instructions */
        .instructions {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
            text-align: center;
            line-height: 1.8;
        }

        .key {
            display: inline-block;
            padding: 5px 10px;
            background: #333;
            border-radius: 4px;
            margin: 0 3px;
        }

        .p1-key { color: #e74c3c; }
        .p2-key { color: #3498db; }
    </style>
</head>
<body>

    <h1>⛏️ BLOCK BATTLE ⛏️</h1>

    <div class="scoreboard">
        <div class="player-score player1-score">
            <span style="color: #e74c3c;">■</span> PLAYER 1: <span id="score1">0</span>
        </div>
        <div class="player-score player2-score">
            <span style="color: #3498db;">■</span> PLAYER 2: <span id="score2">0</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="winner">
            <span id="winnerText"></span>
            <br><br>
            <button id="restart-btn" onclick="resetGame()" style="display:inline-block;">PLAY AGAIN</button>
        </div>
    </div>

    <div class="instructions">
        <span class="key p1-key">W</span><span class="key p1-key">A</span><span class="key p1-key">S</span><span class="key p1-key">D</span> - Player 1
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <span class="key p2-key">↑</span><span class="key p2-key">←</span><span class="key p2-key">↓</span><span class="key p2-key">→</span> - Player 2
        <br>
        First to 50 points wins!
    </div>

    <script>
        // --- GAME SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const winnerDiv = document.getElementById('winner');
        const winnerText = document.getElementById('winnerText');
        const restartBtn = document.getElementById('restart-btn');

        // Game constants
        const PLAYER_SIZE = 30;
        const BLOCK_SIZE = 20;
        const GROUND_Y = 350;
        const WIN_SCORE = 50;

        // Player 1 (Red - WASD)
        const player1 = {
            x: 100,
            y: GROUND_Y - PLAYER_SIZE,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            color: '#e74c3c',
            borderColor: '#c0392b',
            dx: 0,
            dy: 0,
            speed: 5,
            score: 0,
            keys: { up: 'w', down: 's', left: 'a', right: 'd' }
        };

        // Player 2 (Blue - Arrow Keys)
        const player2 = {
            x: 670,
            y: GROUND_Y - PLAYER_SIZE,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            color: '#3498db',
            borderColor: '#2980b9',
            dx: 0,
            dy: 0,
            speed: 5,
            score: 0,
            keys: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }
        };

        // Collectible blocks
        let blocks = [];
        let gameRunning = true;
        let keys = {};

        // Initialize game
        function init() {
            createBlocks(8);
            gameLoop();
        }

        // Create random blocks
        function createBlocks(count) {
            blocks = [];
            for (let i = 0; i < count; i++) {
                blocks.push({
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: Math.random() * (GROUND_Y - 100) + 50,
                    size: BLOCK_SIZE,
                    collected: false,
                    color: Math.random() > 0.5 ? '#f1c40f' : '#2ecc71', // Gold or Emerald
                    borderColor: Math.random() > 0.5 ? '#d4ac0d' : '#27ae60'
                });
            }
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Update player positions
        function updatePlayer(player, upKey, downKey, leftKey, rightKey) {
            // Horizontal movement
            if (keys[leftKey]) player.x -= player.speed;
            if (keys[rightKey]) player.x += player.speed;

            // Vertical movement (jump)
            if (keys[upKey] && player.y >= GROUND_Y - PLAYER_SIZE) {
                player.dy = -12;
            }

            // Apply gravity
            player.dy += 0.5;
            player.y += player.dy;

            // Ground collision
            if (player.y > GROUND_Y - PLAYER_SIZE) {
                player.y = GROUND_Y - PLAYER_SIZE;
                player.dy = 0;
            }

            // Wall boundaries
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }

        // Check collision with blocks
        function checkBlockCollision(player, scoreId) {
            blocks.forEach(block => {
                if (!block.collected &&
                    player.x < block.x + block.size &&
                    player.x + player.width > block.x &&
                    player.y < block.y + block.size &&
                    player.y + player.height > block.y) {
                    
                    block.collected = true;
                    player.score += 10;
                    document.getElementById(scoreId).textContent = player.score;

                    // Check win condition
                    if (player.score >= WIN_SCORE) {
                        gameRunning = false;
                        showWinner(player === player1 ? "PLAYER 1" : "PLAYER 2", player.color);
                    }
                }
            });
        }

        // Draw functions
        function drawBackground() {
            // Sky is handled by CSS gradient
            
            // Draw ground
            ctx.fillStyle = '#4a2c0f';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            
            // Grass top
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, GROUND_Y, canvas.width, 15);
            
            // Some grass details
            ctx.fillStyle = '#2ecc71';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillRect(i, GROUND_Y, 20, 5);
            }
        }

        function drawPlayer(player) {
            // Body (Minecraft-style square)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Border
            ctx.strokeStyle = player.borderColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(player.x, player.y, player.width, player.height);
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 5, 8, 8);
            ctx.fillRect(player.x + player.width - 13, player.y + 5, 8, 8);
            
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 7, player.y + 7, 4, 4);
            ctx.fillRect(player.x + player.width - 11, player.y + 7, 4, 4);
        }

        function drawBlocks() {
            blocks.forEach(block => {
                if (!block.collected) {
                    ctx.fillStyle = block.color;
                    ctx.fillRect(block.x, block.y, block.size, block.size);
                    ctx.strokeStyle = block.borderColor;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(block.x, block.y, block.size, block.size);
                    
                    // Shine effect
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(block.x + 2, block.y + 2, 6, 6);
                }
            });

            // Respawn blocks if all collected
            const remaining = blocks.filter(b => !b.collected).length;
            if (remaining === 0) {
                createBlocks(8);
            }
        }

        function showWinner(playerName, color) {
            winnerText.textContent = playerName + " WINS!";
            winnerText.style.color = color;
            winnerDiv.style.backgroundColor = 'rgba(0,0,0,0.9)';
            winnerDiv.style.border = `4px solid ${color}`;
            winnerDiv.style.display = 'block';
            restartBtn.style.display = 'inline-block';
        }

        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw everything
            drawBackground();
            drawBlocks();
            
            // Update and draw players
            updatePlayer(player1, 'w', 's', 'a', 'd');
            updatePlayer(player2, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');
            
            drawPlayer(player1);
            drawPlayer(player2);

            // Check collisions
            checkBlockCollision(player1, 'score1');
            checkBlockCollision(player2, 'score2');

            requestAnimationFrame(gameLoop);
        }

        // Reset game
        function resetGame() {
            player1.score = 0;
            player2.score = 0;
            player1.x = 100;
            player2.x = 670;
            player1.y = GROUND_Y - PLAYER_SIZE;
            player2.y = GROUND_Y - PLAYER_SIZE;
            player1.dy = 0;
            player2.dy = 0;
            
            document.getElementById('score1').textContent = '0';
            document.getElementById('score2').textContent = '0';
            
            winnerDiv.style.display = 'none';
            gameRunning = true;
            
            createBlocks(8);
            gameLoop();
        }

        // Start the game
        init();
    </script>
</body>
</html>
