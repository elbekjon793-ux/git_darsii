<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASILA SNAKE</title>
<style>
body{background:#0f0c29;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;padding:10px}
#container{display:flex;gap:15px;align-items:flex-start}
#left{text-align:left}
#center{text-align:center}
#right{text-align:right}
h1{color:#00ff88;font-size:22px;margin:0 0 10px}
.btn{padding:8px 14px;margin:3px;border-radius:15px;border:2px solid #555;background:#222;color:#888;cursor:pointer;display:inline-block}
.btn.active{border-color:#00ff88;background:#00ff88;color:#000}
.btn.p{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.score{padding:8px 12px;margin:3px 0;background:#000;border:2px solid #00ff88;border-radius:12px;color:#fff;font-size:13px}
.score.h{border-color:#ffd700;color:#ffd700}
canvas{border:3px solid #00ff88;background:#000;display:block}
#wrap{position:relative}
#over{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;flex-direction:column}
#over h2{color:#f44;margin:10px 0}
#over p{color:#fff;margin:5px 0}
/* Touch tugmalar */
#touch{display:none;margin-top:10px}
.touch-row{display:flex;justify-content:center;gap:8px;margin:5px 0}
.ctrl{padding:15px 25px;border-radius:10px;border:2px solid #00ff88;background:rgba(0,255,136,0.2);color:#00ff88;font-size:18px;cursor:pointer}
.ctrl:active{background:#00ff88;color:#000}
.ctrl.p2{border-color:#ff6b6b;background:rgba(255,107,107,0.2);color:#ff6b6b}
.ctrl.p2:active{background:#ff6b6b;color:#000}
@media(max-width:700px){
#container{flex-direction:column;align-items:center}
#left,#right{text-align:center}
#touch{display:block}
}
</style>
</head>
<body>
<div id="container">
<div id="left">
<h1>ASILA SNAKE</h1>
<span class="score h">REKORD: <span id="hs">0</span></span><br>
<span class="score" id="sc1">P1: <span id="s1">0</span></span><br>
<span class="score" id="sc2">P2: <span id="s2">0</span></span>
</div>
<div id="center">
<button class="btn active" id="m1" onclick="m=1;up()">1 KISHI</button>
<button class="btn p" id="m2" onclick="m=2;up()">2 KISHI</button>
<div id="wrap"><canvas id="c" width="320" height="320"></canvas>
<div id="over"><h2>GOLIB!</h2><p id="win"></p><button class="btn active" onclick="start()">QAYTA</button></div>
</div>
<div id="touch">
<div class="touch-row"><button class="ctrl" onclick="mv(1,'up')">▲</button></div>
<div class="touch-row">
<button class="ctrl" onclick="mv(1,'left')">◀</button>
<button class="ctrl" onclick="mv(1,'down')">▼</button>
<button class="ctrl" onclick="mv(1,'right')">▶</button>
</div>
</div>
</div>
<div id="right">
<button class="btn" onclick="sp=150" id="e">Oson</button>
<button class="btn" onclick="sp=100" id="o">Orta</button>
<button class="btn" onclick="sp=60" id="q">Qiyin</button>
<br>
<button class="btn active" style="background:#00ff88;color:#000" onclick="start()">START</button>
<br>
<button class="btn" id="pz" onclick="pau()">PAUZA</button>
<br>
<br>
<p style="color:#888;font-size:11px">P1: WASD<br>P2: Arrow Keys</p>
</div>
</div>
<script>
var C=document.getElementById("c"),X=C.getContext("2d"),G=16;
var c1=["#3498db","#2980b9","#1abc9c"],c2=["#e91e63","#d81b60","#ff6b6b"];
var fd=[{c:"#f44",p:1},{c:"#fd0",p:3},{c:"#2e0",p:5}];
var s=[],s2=[],f={},sc=0,sc2=0,dx=G,dy=0,dx2=-G,dy2=0;
var m=1,sp=150,run=false,t=null,ps=false;
var hs=localStorage.getItem("hs")||0;
document.getElementById("hs").innerText=hs;

function up(){
document.getElementById("m1").className="btn active";
document.getElementById("m2").className="btn p";
document.getElementById("sc2").style.display=m===2?"block":"none";
}

function start(){
C.width=C.height=window.innerWidth<400?300:350;G=C.width/20;
s=[{x:3*G,y:5*G},{x:2*G,y:5*G},{x:1*G,y:5*G},{x:0,y:5*G}];
sc=0;dx=G;dy=0;ps=false;run=true;
document.getElementById("s1").innerText=sc;
document.getElementById("over").style.display="none";
if(m===2){
s2=[{x:(C.width/G-4)*G,y:5*G},{x:(C.width/G-3)*G,y:5*G},{x:(C.width/G-2)*G,y:5*G},{x:(C.width/G-1)*G,y:5*G}];
sc2=0;dx2=-G;dy2=0;
document.getElementById("s2").innerText=sc2;
}
sf();dw();
if(t)clearInterval(t);
t=setInterval(gl,sp);
}

function sf(){
f.t=Math.random()*.5<.5?0:Math.random()*.75<.75?1:2;
var v=false;
while(!v){
f.x=Math.floor(Math.random()*(C.width/G))*G;
f.y=Math.floor(Math.random()*(C.height/G))*G;
v=true;
s.forEach(a=>{if(a.x===f.x&&a.y===f.y)v=false});
if(m===2)s2.forEach(a=>{if(a.x===f.x&&a.y===f.y)v=false});
}
}

function gl(){
if(!run||ps)return;
if(m===2){ms2();if(chk(2)){eg(1);return}}
ms();
if(chk(1)){eg(m===2?2:1);return}
dw();
}

function ms(){
var h={x:s[0].x+dx,y:s[0].y+dy};
s.unshift(h);
if(h.x===f.x&&h.y===f.y){sc+=fd[f.t].p;document.getElementById("s1").innerText=sc;if(sp>40)sp-=2;clearInterval(t);t=setInterval(gl,sp);sf()}else s.pop();
}

function ms2(){
var h={x:s2[0].x+dx2,y:s2[0].y+dy2};
s2.unshift(h);
if(h.x===f.x&&h.y===f.y){sc2+=fd[f.t].p;document.getElementById("s2").innerText=sc2;sf()}else s2.pop();
}

function chk(p){
var S=p===1?s:s2,h=S[0];
if(h.x<0||h.x>=C.width||h.y<0||h.y>=C.height)return true;
for(var i=1;i<S.length;i++)if(h.x===S[i].x&&h.y===S[i].y)return true;
return false;
}

function eg(w){
run=false;clearInterval(t);
if(m===1&&sc>hs){hs=sc;localStorage.setItem("hs",hs);document.getElementById("hs").innerText=hs;}
else if(m===2){w=sc>sc2?1:sc2>sc?2:"D"}
document.getElementById("win").innerText=w==="D"?"DURANG!":"GOLIB: P"+w;
document.getElementById("over").style.display="flex";
}

function dw(){
X.fillStyle="#000";X.fillRect(0,0,C.width,C.height);
s.forEach(a=>{X.fillStyle=c1[0];X.fillRect(a.x+1,a.y+1,G-2,G-2)});
if(m===2)s2.forEach(a=>{X.fillStyle=c2[0];X.fillRect(a.x+1,a.y+1,G-2,G-2)});
X.fillStyle=fd[f.t].c;X.beginPath();X.arc(f.x+G/2,f.y+G/2,G/2-2,0,Math.PI*2);X.fill();
}

function pau(){
if(!run)return;
ps=!ps;
document.getElementById("pz").innerText=ps?"DAVOM":"PAUZA";
}

// Keyboard
document.onkeydown=function(e){
if(e.key==="w"&&dy!==G)dx=0,dy=-G;
else if(e.key==="s"&&dy!==-G)dx=0,dy=G;
else if(e.key==="a"&&dx!==G)dx=-G,dy=0;
else if(e.key==="d"&&dx!==-G)dx=G,dy=0;
else if(e.key==="ArrowUp"&&dy2!==G)dx2=0,dy2=-G;
else if(e.key==="ArrowDown"&&dy2!==-G)dx2=0,dy2=G;
else if(e.key==="ArrowLeft"&&dx2!==G)dx2=-G,dy2=0;
else if(e.key==="ArrowRight"&&dx2!==-G)dx2=G,dy2=0;
}

// Touch (telefon uchun)
function mv(p,d){
if(p===1){
if(d==="up"&&dy!==G)dx=0,dy=-G;
if(d==="down"&&dy!==-G)dx=0,dy=G;
if(d==="left"&&dx!==G)dx=-G,dy=0;
if(d==="right"&&dx!==-G)dx=G,dy=0;
}
}
up();
</script>
</body>
</html>
