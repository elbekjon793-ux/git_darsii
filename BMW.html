<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMW M5 Style 3D Race</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070b12;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .panel {
      color: white;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      background: rgba(5, 8, 16, 0.48);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .title {
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .hint {
      margin-top: 4px;
      opacity: 0.75;
      font-size: 13px;
    }

    .stats {
      min-width: 160px;
      text-align: right;
      font-weight: 700;
      line-height: 1.45;
    }

    #mobileControls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 6;
      display: flex;
      justify-content: space-between;
      padding: 0 22px;
      pointer-events: none;
    }

    .control {
      pointer-events: auto;
      width: 82px;
      height: 82px;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 48px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    .control:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.32);
    }

    .hidden {
      display: none !important;
    }

    #gameOver {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
    }

    .card {
      width: min(420px, calc(100vw - 34px));
      text-align: center;
      color: white;
      padding: 28px;
      border-radius: 24px;
      background: rgba(9, 12, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }

    .card h1 {
      margin: 0 0 10px;
      font-size: 38px;
    }

    .card p {
      font-size: 22px;
      font-weight: 800;
    }

    #restartBtn {
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      color: white;
      font-size: 17px;
      font-weight: 800;
      background: linear-gradient(135deg, #0ea5ff, #7c3aed);
      cursor: pointer;
    }

    #restartBtn:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      #hud {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .panel {
        padding: 10px 11px;
        border-radius: 14px;
      }

      .hint {
        display: none;
      }

      .stats {
        min-width: 135px;
        font-size: 14px;
      }

      .control {
        width: 74px;
        height: 74px;
        font-size: 44px;
      }
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="panel">
      <div class="title">BMW M5 Style 3D Race</div>
      <div class="hint">PC: ← → yoki A/D | Android: tugma yoki swipe</div>
    </div>

    <div class="panel stats">
      <div>Ball: <span id="score">0</span></div>
      <div>Tezlik: <span id="speed">0</span> km/h</div>
    </div>
  </div>

  <div id="mobileControls">
    <button id="leftBtn" class="control">‹</button>
    <button id="rightBtn" class="control">›</button>
  </div>

  <div id="gameOver" class="hidden">
    <div class="card">
      <h1>GAME OVER</h1>
      <p>Ball: <span id="finalScore">0</span></p>
      <button id="restartBtn">Qayta boshlash</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const scoreEl = document.getElementById("score");
    const speedEl = document.getElementById("speed");
    const gameOverEl = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7fc7ff);
    scene.fog = new THREE.Fog(0x7fc7ff, 35, 180);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );

    camera.position.set(0, 6.8, 13.5);
    camera.lookAt(0, 1, -8);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x226622, 1.25);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(-6, 14, 8);
    scene.add(sun);

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function choice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function damp(current, target, lambda, dt) {
      return current + (target - current) * (1 - Math.exp(-lambda * dt));
    }

    const roadMat = new THREE.MeshStandardMaterial({
      color: 0x24262e,
      roughness: 0.85
    });

    const grassMat = new THREE.MeshStandardMaterial({
      color: 0x21713a,
      roughness: 0.9
    });

    const lineMat = new THREE.MeshStandardMaterial({
      color: 0xf4f7ff,
      roughness: 0.35
    });

    const edgeMat = new THREE.MeshStandardMaterial({
      color: 0xfff0b3,
      roughness: 0.4
    });

    const treeTrunkMat = new THREE.MeshStandardMaterial({
      color: 0x7a4a25
    });

    const treeLeafMat = new THREE.MeshStandardMaterial({
      color: 0x1f8a3d
    });

    const signMat = new THREE.MeshStandardMaterial({
      color: 0x1565c0,
      metalness: 0.1,
      roughness: 0.35
    });

    const metalMat = new THREE.MeshStandardMaterial({
      color: 0xb8c0cc,
      metalness: 0.8,
      roughness: 0.25
    });

    const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 300), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -55;
    scene.add(road);

    const grassLeft = new THREE.Mesh(new THREE.PlaneGeometry(70, 300), grassMat);
    grassLeft.rotation.x = -Math.PI / 2;
    grassLeft.position.set(-40, -0.01, -55);
    scene.add(grassLeft);

    const grassRight = new THREE.Mesh(new THREE.PlaneGeometry(70, 300), grassMat);
    grassRight.rotation.x = -Math.PI / 2;
    grassRight.position.set(40, -0.01, -55);
    scene.add(grassRight);

    const edgeGeo = new THREE.BoxGeometry(0.16, 0.035, 300);

    [-5.05, 5.05].forEach((x) => {
      const edge = new THREE.Mesh(edgeGeo, edgeMat);
      edge.position.set(x, 0.035, -55);
      scene.add(edge);
    });

    const roadMarks = [];
    const markGeo = new THREE.BoxGeometry(0.12, 0.04, 4.2);

    const MARK_MIN_Z = -145;
    const MARK_MAX_Z = 35;
    const MARK_SPACING = 8.5;
    const MARK_RANGE = MARK_MAX_Z - MARK_MIN_Z + MARK_SPACING;

    for (let z = MARK_MIN_Z; z < MARK_MAX_Z; z += MARK_SPACING) {
      [-1.52, 1.52].forEach((x) => {
        const mark = new THREE.Mesh(markGeo, lineMat);
        mark.position.set(x, 0.05, z);
        scene.add(mark);
        roadMarks.push(mark);
      });
    }

    const roadsideObjects = [];

    const treeTrunkGeo = new THREE.CylinderGeometry(0.13, 0.18, 1.2, 6);
    const treeLeafGeo = new THREE.ConeGeometry(0.85, 2.0, 7);
    const signPostGeo = new THREE.CylinderGeometry(0.055, 0.055, 1.35, 8);
    const signBoardGeo = new THREE.BoxGeometry(1.45, 0.65, 0.08);

    function createTree() {
      const g = new THREE.Group();

      const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
      trunk.position.y = 0.6;
      g.add(trunk);

      const leaf = new THREE.Mesh(treeLeafGeo, treeLeafMat);
      leaf.position.y = 2.0;
      g.add(leaf);

      return g;
    }

    function createSign() {
      const g = new THREE.Group();

      const post = new THREE.Mesh(signPostGeo, metalMat);
      post.position.y = 0.68;
      g.add(post);

      const board = new THREE.Mesh(signBoardGeo, signMat);
      board.position.y = 1.55;
      g.add(board);

      return g;
    }

    function resetRoadsideObject(obj, initial = false) {
      const side = Math.random() < 0.5 ? -1 : 1;
      obj.position.x = side * rand(7.2, 23);
      obj.position.y = 0;
      obj.position.z = initial ? rand(-145, 30) : rand(-165, -125);
      obj.rotation.y = rand(0, Math.PI * 2);
    }

    for (let i = 0; i < 55; i++) {
      const obj = Math.random() < 0.74 ? createTree() : createSign();
      resetRoadsideObject(obj, true);
      scene.add(obj);
      roadsideObjects.push(obj);
    }

    function createCar(color = 0x111111, isPlayer = false) {
      const car = new THREE.Group();
      car.userData.wheels = [];

      const bodyMat = new THREE.MeshStandardMaterial({
        color,
        metalness: isPlayer ? 0.65 : 0.35,
        roughness: 0.28
      });

      const darkMat = new THREE.MeshStandardMaterial({
        color: 0x07090f,
        metalness: 0.25,
        roughness: 0.45
      });

      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x101927,
        metalness: 0.2,
        roughness: 0.08
      });

      const headLightMat = new THREE.MeshStandardMaterial({
        color: 0xdff5ff,
        emissive: 0x7ddcff,
        emissiveIntensity: isPlayer ? 1.15 : 0.2
      });

      const tailLightMat = new THREE.MeshStandardMaterial({
        color: 0xff2233,
        emissive: 0xff0018,
        emissiveIntensity: 0.9
      });

      const wheelMat = new THREE.MeshStandardMaterial({
        color: 0x080808,
        roughness: 0.65
      });

      const rimMat = new THREE.MeshStandardMaterial({
        color: 0xc9d1dd,
        metalness: 0.85,
        roughness: 0.22
      });

      const base = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.55, 4.45), bodyMat);
      base.position.y = 0.62;
      car.add(base);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.28, 1.35), bodyMat);
      hood.position.set(0, 0.92, -1.35);
      car.add(hood);

      const trunk = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.25, 1.15), bodyMat);
      trunk.position.set(0, 0.88, 1.42);
      car.add(trunk);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.62, 1.65), glassMat);
      cabin.position.set(0, 1.2, -0.2);
      car.add(cabin);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.16, 1.45), bodyMat);
      roof.position.set(0, 1.58, -0.2);
      car.add(roof);

      const frontBumper = new THREE.Mesh(
        new THREE.BoxGeometry(2.05, 0.22, 0.18),
        darkMat
      );
      frontBumper.position.set(0, 0.48, -2.31);
      car.add(frontBumper);

      const rearBumper = new THREE.Mesh(
        new THREE.BoxGeometry(2.05, 0.2, 0.18),
        darkMat
      );
      rearBumper.position.set(0, 0.48, 2.31);
      car.add(rearBumper);

      [-0.18, 0.18].forEach((x) => {
        const grille = new THREE.Mesh(
          new THREE.BoxGeometry(0.25, 0.18, 0.055),
          darkMat
        );
        grille.position.set(x, 0.79, -2.43);
        car.add(grille);
      });

      [-0.68, 0.68].forEach((x) => {
        const light = new THREE.Mesh(
          new THREE.BoxGeometry(0.48, 0.11, 0.055),
          headLightMat
        );
        light.position.set(x, 0.82, -2.44);
        car.add(light);
      });

      [-0.68, 0.68].forEach((x) => {
        const light = new THREE.Mesh(
          new THREE.BoxGeometry(0.46, 0.12, 0.055),
          tailLightMat
        );
        light.position.set(x, 0.78, 2.44);
        car.add(light);
      });

      [-0.72, 0.72].forEach((x) => {
        const exhaust = new THREE.Mesh(
          new THREE.CylinderGeometry(0.055, 0.055, 0.35, 8),
          metalMat
        );
        exhaust.rotation.x = Math.PI / 2;
        exhaust.position.set(x, 0.35, 2.48);
        car.add(exhaust);
      });

      if (isPlayer) {
        const stripeColors = [0x2fa7ff, 0x244bff, 0xff233a];

        stripeColors.forEach((c, i) => {
          const stripeMat = new THREE.MeshStandardMaterial({
            color: c,
            emissive: c,
            emissiveIntensity: 0.15
          });

          const stripe = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.035, 1.05),
            stripeMat
          );
          stripe.position.set(-0.18 + i * 0.12, 1.075, -1.42);
          car.add(stripe);
        });
      }

      const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.48, 18);
      const rimGeo = new THREE.CylinderGeometry(0.19, 0.19, 0.5, 18);

      [-1.12, 1.12].forEach((x) => {
        [-1.45, 1.45].forEach((z) => {
          const wheelGroup = new THREE.Group();
          wheelGroup.position.set(x, 0.38, z);

          const tire = new THREE.Mesh(wheelGeo, wheelMat);
          tire.rotation.z = Math.PI / 2;
          wheelGroup.add(tire);

          const rim = new THREE.Mesh(rimGeo, rimMat);
          rim.rotation.z = Math.PI / 2;
          wheelGroup.add(rim);

          car.add(wheelGroup);
          car.userData.wheels.push(wheelGroup);
        });
      });

      return car;
    }

    const laneXs = [-3.05, 0, 3.05];

    let laneIndex = 1;
    let targetX = laneXs[laneIndex];
    let score = 0;
    let speed = 22;
    let gameOver = false;
    let spawnTimer = 0;

    const maxSpeed = 55;
    const acceleration = 1.15;
    const playerZ = 5.2;
    const obstacles = [];

    const player = createCar(0x05070c, true);
    player.position.set(0, 0, playerZ);
    scene.add(player);

    function rotateWheels(car, roadSpeed, dt) {
      if (!car.userData.wheels) return;

      car.userData.wheels.forEach((wheel) => {
        wheel.rotation.x -= roadSpeed * dt * 1.9;
      });
    }

    function moveLeft() {
      if (gameOver) return;
      laneIndex = Math.max(0, laneIndex - 1);
      targetX = laneXs[laneIndex];
    }

    function moveRight() {
      if (gameOver) return;
      laneIndex = Math.min(laneXs.length - 1, laneIndex + 1);
      targetX = laneXs[laneIndex];
    }

    function spawnObstacle() {
      const colors = [
        0xff2d55,
        0xffc107,
        0x00bcd4,
        0xffffff,
        0x607d8b,
        0x7c3aed
      ];

      const lane = Math.floor(Math.random() * laneXs.length);
      const enemy = createCar(choice(colors), false);

      enemy.scale.setScalar(rand(0.92, 1.02));
      enemy.position.set(laneXs[lane], 0, rand(-142, -125));

      scene.add(enemy);
      obstacles.push(enemy);
    }

    function removeObstacle(index) {
      const obj = obstacles[index];
      scene.remove(obj);
      obstacles.splice(index, 1);
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = Math.floor(score);
      gameOverEl.classList.remove("hidden");

      player.rotation.z = 0.28;
      player.rotation.y = -0.18;
    }

    function restartGame() {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        removeObstacle(i);
      }

      score = 0;
      speed = 22;
      spawnTimer = 0;
      gameOver = false;

      laneIndex = 1;
      targetX = laneXs[laneIndex];

      player.position.set(0, 0, playerZ);
      player.rotation.set(0, 0, 0);

      scoreEl.textContent = "0";
      speedEl.textContent = "0";
      gameOverEl.classList.add("hidden");
    }

    function updateWorld(dt) {
      for (const mark of roadMarks) {
        mark.position.z += speed * dt;

        while (mark.position.z > MARK_MAX_Z) {
          mark.position.z -= MARK_RANGE;
        }
      }

      for (const obj of roadsideObjects) {
        obj.position.z += speed * dt;

        if (obj.position.z > 35) {
          resetRoadsideObject(obj, false);
        }
      }
    }

    function updatePlayer(dt) {
      const oldX = player.position.x;

      player.position.x = damp(player.position.x, targetX, 10, dt);

      const vx = (player.position.x - oldX) / Math.max(dt, 0.001);

      player.rotation.z = damp(player.rotation.z, -vx * 0.018, 8, dt);
      player.rotation.y = damp(player.rotation.y, -vx * 0.012, 8, dt);

      rotateWheels(player, speed, dt);
    }

    function updateObstacles(dt) {
      spawnTimer -= dt;

      if (spawnTimer <= 0) {
        spawnObstacle();

        const interval = THREE.MathUtils.mapLinear(speed, 22, maxSpeed, 1.25, 0.66);
        spawnTimer = interval + Math.random() * 0.45;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const enemy = obstacles[i];

        enemy.position.z += speed * dt;
        rotateWheels(enemy, speed, dt);

        if (enemy.position.z > 22) {
          removeObstacle(i);
          continue;
        }

        const dx = Math.abs(enemy.position.x - player.position.x);
        const dz = Math.abs(enemy.position.z - player.position.z);

        if (dx < 1.72 && dz < 3.75) {
          endGame();
          return;
        }
      }
    }

    function updateCamera(dt) {
      camera.position.x = damp(camera.position.x, player.position.x * 0.36, 4, dt);
      camera.position.y = damp(camera.position.y, 6.8 + speed * 0.008, 2, dt);
      camera.position.z = damp(camera.position.z, 13.5 + speed * 0.015, 2, dt);

      camera.lookAt(player.position.x * 0.25, 1.05, -8);
    }

    function updateHUD() {
      scoreEl.textContent = Math.floor(score);
      speedEl.textContent = Math.floor(speed * 6);
    }

    function update(dt) {
      speed = Math.min(maxSpeed, speed + acceleration * dt);
      score += speed * dt;

      updateWorld(dt);
      updatePlayer(dt);
      updateObstacles(dt);
      updateCamera(dt);
      updateHUD();
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") {
        e.preventDefault();
        moveLeft();
      }

      if (e.code === "ArrowRight" || e.code === "KeyD") {
        e.preventDefault();
        moveRight();
      }

      if (gameOver && e.code === "Space") {
        restartGame();
      }
    });

    leftBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveLeft();
    });

    rightBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveRight();
    });

    restartBtn.addEventListener("click", restartGame);

    let pointerStartX = 0;
    let pointerStartY = 0;

    canvas.addEventListener("pointerdown", (e) => {
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
    });

    canvas.addEventListener("pointerup", (e) => {
      if (gameOver) return;

      const dx = e.clientX - pointerStartX;
      const dy = e.clientY - pointerStartY;

      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) moveLeft();
        else moveRight();
      } else {
        if (e.clientX < window.innerWidth / 2) moveLeft();
        else moveRight();
      }
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    resize();

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!gameOver) {
        update(dt);
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
